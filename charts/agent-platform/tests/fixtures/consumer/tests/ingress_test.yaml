suite: Ingress networking
# HD-3.3: templates/ingress.yaml (rendered only when networking.type=ingress).
# Asserts the conditional rendering, the className/host/backends/paths. The
# helm test connection hook (templates/tests/test-connection.yaml) is a
# shipwright-chart template and its cases stay in that chart.
tests:
  - it: renders a networking.k8s.io/v1 Ingress when networking.type=ingress
    template: templates/ingress.yaml
    set:
      networking.type: ingress
    release:
      name: r
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: r-shipwright

  - it: uses the configured ingressClassName and host
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      networking.ingress.className: alb
      networking.ingress.host: shipwright.example.com
    asserts:
      - equal:
          path: spec.ingressClassName
          value: alb
      - equal:
          path: spec.rules[0].host
          value: shipwright.example.com

  - it: applies configured ingress annotations
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      networking.ingress.annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
    asserts:
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/scheme"]
          value: internet-facing

  - it: routes / to the admin Service (port http) and /dashboard to the metrics Service (port http)
    template: templates/ingress.yaml
    set:
      networking.type: ingress
    release:
      name: r
    asserts:
      # /dashboard -> metrics (declared first so the more-specific prefix wins)
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /dashboard
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: r-shipwright-metrics
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.name
          value: http
      # / -> admin
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[1].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: r-shipwright-admin
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.port.name
          value: http

  - it: omits the /dashboard path when metrics is disabled
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      metrics.enabled: false
    release:
      name: r
    asserts:
      # Only the admin "/" path remains.
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 1
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: r-shipwright-admin

  # ---- task-store opt-in external path (TSP-1.1) ----
  - it: routes /task-store to the task-store Service with prefix-strip rewrite when taskStore.expose.enabled
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      taskStore.enabled: true
      taskStore.expose.enabled: true
    release:
      name: r
    asserts:
      # nginx prefix-strip rewrite annotation is present only when exposed
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/rewrite-target"]
          value: /$2
      # paths: /dashboard (0), /task-store (1), / (2) — task-store before admin catch-all
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 3
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /task-store(/|$)(.*)
      - equal:
          path: spec.rules[0].http.paths[1].pathType
          value: ImplementationSpecific
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: r-shipwright-task-store
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.port.name
          value: http
      # admin "/" catch-all remains last, though its path shape is also
      # affected by the shared rewrite-target — see the dedicated test below.
      - equal:
          path: spec.rules[0].http.paths[2].backend.service.name
          value: r-shipwright-admin

  - it: switches metrics and admin to no-op-rewrite capture-group paths once the shared rewrite-target is active (TSP-1.1 regression)
    # `rewrite-target` is per-INGRESS, not per-path: once task-store's exposure
    # turns it on, nginx applies "/$2" to every path here, not just
    # task-store's. A plain "/dashboard" or "/" Prefix path has no $2 group, so
    # nginx would rewrite every request under them to an empty/garbled path —
    # both the metrics dashboard and any admin route below "/" would 404. The
    # fix makes $2 recapture the full original suffix for both, so "/$2" is a
    # no-op round-trip once the shared rewrite is in play.
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      taskStore.enabled: true
      taskStore.expose.enabled: true
    release:
      name: r
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /()(dashboard.*)
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: ImplementationSpecific
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: r-shipwright-metrics
      - equal:
          path: spec.rules[0].http.paths[2].path
          value: /()(.*)
      - equal:
          path: spec.rules[0].http.paths[2].pathType
          value: ImplementationSpecific
      - equal:
          path: spec.rules[0].http.paths[2].backend.service.name
          value: r-shipwright-admin

  - it: keeps the plain /dashboard and / paths when task-store is not exposed (no rewrite-target to interact with)
    template: templates/ingress.yaml
    set:
      networking.type: ingress
    release:
      name: r
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /dashboard
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[1].pathType
          value: Prefix

  - it: honors an overridden task-store pathPrefix on the Ingress path
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      taskStore.enabled: true
      taskStore.expose.enabled: true
      taskStore.expose.pathPrefix: /tasks-api
    release:
      name: r
    asserts:
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /tasks-api(/|$)(.*)

  - it: omits the /task-store path and rewrite annotation when taskStore.expose is disabled (default)
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      taskStore.enabled: true
    release:
      name: r
    asserts:
      # only /dashboard + / paths — no task-store path
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 2
      - notExists:
          path: metadata.annotations["nginx.ingress.kubernetes.io/rewrite-target"]

  - it: omits the /task-store path and rewrite annotation when expose.enabled but taskStore.enabled=false (guarded — no dangling path to an absent Service)
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      taskStore.enabled: false
      taskStore.expose.enabled: true
    release:
      name: r
    asserts:
      # only /dashboard + / paths — the task-store workload is not rendered, so no
      # task-store path or rewrite annotation is rendered either
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 2
      - notExists:
          path: metadata.annotations["nginx.ingress.kubernetes.io/rewrite-target"]

  # ---- TLS + cert-manager ingress-shim (CNH-3.1) ----
  - it: renders spec.tls and the cert-manager cluster-issuer ingress-shim annotation when tls.certManager is enabled with a bring-your-own ClusterIssuer
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      networking.ingress.host: shipwright.example.com
      tls.certManager.enabled: true
      tls.certManager.issuerRef.name: letsencrypt-prod
      tls.certManager.issuerRef.kind: ClusterIssuer
    release:
      name: r
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: r-shipwright-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: shipwright.example.com
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod
      - notExists:
          path: metadata.annotations["cert-manager.io/issuer"]
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-redirect"]
          value: "true"

  - it: renders NO Certificate document on the ingress path even when tls.certManager is enabled (ingress-shim — cert-manager watches the annotations itself)
    template: templates/certificate.yaml
    set:
      networking.type: ingress
      networking.ingress.host: shipwright.example.com
      tls.certManager.enabled: true
      tls.certManager.issuerRef.name: letsencrypt-prod
      tls.certManager.issuerRef.kind: ClusterIssuer
    release:
      name: r
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the cert-manager.io/issuer annotation key (not cluster-issuer) for a chart-managed namespaced Issuer
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      tls.certManager.enabled: true
      tls.certManager.issuerRef.name: ""
      tls.certManager.issuer.create: true
      tls.certManager.issuer.kind: Issuer
      tls.certManager.issuer.email: admin@example.com
    release:
      name: r
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/issuer"]
          value: r-shipwright-issuer
      - notExists:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]

  - it: renders spec.tls with an explicit secretName override and no cert-manager annotation when cert-manager is not enabled
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      networking.ingress.tls.enabled: true
      networking.ingress.tls.secretName: my-tls
    release:
      name: r
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: my-tls
      - notExists:
          path: metadata.annotations["cert-manager.io/issuer"]
      - notExists:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]

  - it: omits the ssl-redirect annotation when tls.redirect=false even though TLS is on
    template: templates/ingress.yaml
    set:
      networking.type: ingress
      networking.ingress.tls.enabled: true
      networking.ingress.tls.redirect: false
    release:
      name: r
    asserts:
      - notExists:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-redirect"]

  - it: renders NO Ingress with the default networking.type (ClusterIP)
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders NO Ingress for NodePort / LoadBalancer
    template: templates/ingress.yaml
    set:
      networking.type: LoadBalancer
    asserts:
      - hasDocuments:
          count: 0
