suite: admin template seed (SHIPWRIGHT_TEMPLATE_SEED)
templates:
  - templates/admin-deployment.yaml
release:
  name: r
tests:
  - it: renders no SHIPWRIGHT_TEMPLATE_SEED by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "SHIPWRIGHT_TEMPLATE_SEED")]

  - it: renders no SHIPWRIGHT_TEMPLATE_SEED when templateSeed has neither key
    set:
      admin.templateSeed: {}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "SHIPWRIGHT_TEMPLATE_SEED")]

  - it: renders the seed as a JSON string env var
    set:
      admin.templateSeed:
        marketplaces:
          - {name: example-plugins, source: example-org/plugins, ref: v1.2.0}
        plugins:
          - some-plugin@example-plugins
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_TEMPLATE_SEED
            value: '{"marketplaces":[{"name":"example-plugins","ref":"v1.2.0","source":"example-org/plugins"}],"plugins":["some-plugin@example-plugins"]}'

  - it: renders an explicit empty marketplaces list so operators can clear the seed
    set:
      admin.templateSeed:
        marketplaces: []
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_TEMPLATE_SEED
            value: '{"marketplaces":[]}'

  - it: renders an explicit empty plugins list
    set:
      admin.templateSeed:
        plugins: []
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHIPWRIGHT_TEMPLATE_SEED
            value: '{"plugins":[]}'

  - it: fails naming the entry when a marketplace is missing source
    set:
      admin.templateSeed:
        marketplaces:
          - {name: example-plugins}
    asserts:
      - failedTemplate:
          errorPattern: 'admin.templateSeed.marketplaces\[0\] \(example-plugins\).*source'

  - it: fails naming the index when a marketplace is missing name
    set:
      admin.templateSeed:
        marketplaces:
          - {name: ok, source: example-org/plugins}
          - {source: example-org/other}
    asserts:
      - failedTemplate:
          errorPattern: 'admin.templateSeed.marketplaces\[1\].*name'

  - it: fails when a plugins entry is not a string
    set:
      admin.templateSeed:
        plugins:
          - some-plugin@example-plugins
          - {name: nope}
    asserts:
      - failedTemplate:
          errorPattern: 'admin.templateSeed.plugins\[1\].*string'

  - it: still validates when admin is disabled
    set:
      admin.enabled: false
      admin.templateSeed:
        marketplaces:
          - {name: example-plugins}
    asserts:
      - failedTemplate:
          errorPattern: 'admin.templateSeed.marketplaces\[0\]'
