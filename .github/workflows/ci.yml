name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo (checkout, build, test,
# docker build). None pushes, opens PRs or publishes packages.
permissions:
  contents: read

jobs:
  # Fast gates (layer 0). The unit job needs this one, so a lint / type /
  # boundary failure skips every test layer.
  gates:
    name: gates (lint / typecheck / boundary)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not floating: Bun 1.4.0 changed `process.env.KEY = undefined`
          # to coerce to the string "undefined" instead of deleting the key.
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Port of the monorepo's platform gate: no import may leave runtime/,
      # admin/, lib/, agent-types/ and chat/; chat/ may import only agent-lib
      # workspace modules and npm packages.
      - name: Import-boundary gate
        run: bun run check:boundary

      # Every third-party import in runtime/, lib/ and admin/src must be
      # declared in the owning package's dependencies.
      - name: Declared-dependencies gate
        run: bun run check:deps

      # Every process.env.* in runtime/, admin/ and chat/ must be documented in
      # docs/configuration-agent.md (or allowlisted in the script).
      - name: Config-docs gate
        run: bun run check:config-docs

      # lib/admin-types.ts is generated from admin/openapi.platform.json by a
      # pinned bunx openapi-typescript (needs network; not a dependency). A
      # stale file fails here instead of surfacing at release.
      - name: Admin types drift gate
        run: |
          bun run generate:admin-types
          if ! git diff --exit-code lib/admin-types.ts; then
            echo "::error file=lib/admin-types.ts::lib/admin-types.ts is out of date with admin/openapi.platform.json. Run 'bun run generate:admin-types' and commit the result."
            exit 1
          fi

  # Layer 1. No database or browser: unit tests mock Prisma and only read the
  # DATABASE_URL_* names as strings (verified by grep over *.unit.test.ts).
  # Timeout decision: the plan sets the layer budget as suite target x 1.5
  # (unit 1 min), which covers the test command only, not checkout + install.
  # So `timeout-minutes` is per test step with the per-layer value, and the job
  # level stays generous to cover setup.
  unit:
    name: unit
    needs: gates
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not floating: Bun 1.4.0 changed `process.env.KEY = undefined`
          # to coerce to the string "undefined" instead of deleting the key.
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Wall-clock of the layer's test command goes to the job summary (the
      # first Tier 1 speed measurement; see docs/test-readiness/test-readiness-plan.md).
      - name: Unit tests
        timeout-minutes: 1
        run: |
          echo "| Layer | Wall-clock |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          rc=0
          bun run test:unit --coverage --coverage-reporter=lcov || rc=$?
          end=$(date +%s)
          echo "| unit | $((end - start))s (exit $rc) |" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Published for the cross-repo coverage gate, which reads exclusions from
      # .shipwright/coverage.json rather than hardcoding them.
      - name: Upload coverage artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shipwright-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  # Layer 2: real Postgres. Skipped when unit (or the gates) fail. Timeout is
  # on the test step (budget 5 min); job level covers setup, see unit job.
  integration:
    name: integration
    needs: unit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:a47637053e65dc7112aeb7353feb8b87954982ad5fd4524908c284d90d71b5e3
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_ADMIN_TEST: postgres://agent:agent@localhost:5432/agent_admin_test
      DATABASE_URL_SHIPWRIGHT_ADMIN: postgres://agent:agent@localhost:5432/agent_admin_test
      DATABASE_URL_SHIPWRIGHT_CHAT: postgres://agent:agent@localhost:5432/shipwright_chat_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not floating: Bun 1.4.0 changed `process.env.KEY = undefined`
          # to coerce to the string "undefined" instead of deleting the key.
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync test DB schema
        run: cd admin && bunx prisma migrate deploy --schema=prisma/schema

      # Dedicated chat database (DATABASE_URL_SHIPWRIGHT_CHAT above).
      - name: Create chat test database
        run: createdb -h localhost -U agent shipwright_chat_test
        env:
          PGPASSWORD: agent

      - name: Sync chat test DB schema
        run: cd chat && bunx prisma migrate deploy

      # Needed by runtime/browser*.integration.test.ts only.
      - name: Install Playwright chromium-headless-shell
        run: bunx playwright install --with-deps chromium-headless-shell

      - name: Integration tests
        timeout-minutes: 5
        run: |
          echo "| Layer | Wall-clock |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          rc=0
          bun run test:integration || rc=$?
          end=$(date +%s)
          echo "| integration | $((end - start))s (exit $rc) |" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # Layer 3: in-process apps against the Postgres service. Skipped when
  # integration (and so unit / gates) fail. Step-level timeout, see unit job.
  smoke:
    name: smoke
    needs: integration
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:a47637053e65dc7112aeb7353feb8b87954982ad5fd4524908c284d90d71b5e3
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_ADMIN_TEST: postgres://agent:agent@localhost:5432/agent_admin_test
      DATABASE_URL_SHIPWRIGHT_ADMIN: postgres://agent:agent@localhost:5432/agent_admin_test
      DATABASE_URL_SHIPWRIGHT_CHAT: postgres://agent:agent@localhost:5432/shipwright_chat_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, not floating: Bun 1.4.0 changed `process.env.KEY = undefined`
          # to coerce to the string "undefined" instead of deleting the key.
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync test DB schema
        run: cd admin && bunx prisma migrate deploy --schema=prisma/schema

      # Dedicated chat database (DATABASE_URL_SHIPWRIGHT_CHAT above).
      - name: Create chat test database
        run: createdb -h localhost -U agent shipwright_chat_test
        env:
          PGPASSWORD: agent

      - name: Sync chat test DB schema
        run: cd chat && bunx prisma migrate deploy

      - name: Smoke tests
        timeout-minutes: 2
        run: |
          echo "| Layer | Wall-clock |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          rc=0
          bun run test:smoke || rc=$?
          end=$(date +%s)
          echo "| smoke | $((end - start))s (exit $rc) |" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # Aggregate result under the original check name. Branch protection and
  # release.yml (and scripts/release-workflow.unit.test.ts) match
  # "lint / typecheck / boundary / test" by name, so it keeps meaning "gates and
  # every test layer passed" until T-004 moves the required checks onto the
  # split jobs. `always()` so a skipped layer fails it instead of skipping it.
  ci:
    name: lint / typecheck / boundary / test
    needs: [gates, unit, integration, smoke]
    if: always()
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Require every layer to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a gate or test layer did not succeed ($RESULTS)"
              exit 1
            fi
          done

  admin-e2e:
    name: admin e2e
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run from admin/ so the browser revision matches admin's @playwright/test
      # (the root playwright pin can resolve a different chromium revision).
      - name: Install Playwright chromium-headless-shell
        run: cd admin && bunx playwright install --with-deps chromium-headless-shell

      # Boots admin/e2e/test-server.ts (in-memory deps, no database) per spec
      # file and drives it with headless Chromium. `bun test` does not pick
      # these up (*.e2e.ts), so this job is their only CI runner.
      - name: Admin Playwright e2e
        run: cd admin && bunx playwright test --reporter=list

  workflow-lint:
    name: workflow lint (actionlint / zizmor)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: zizmor
        run: pipx run zizmor==1.5.2 --format plain .github/workflows

  pack-smoke:
    name: packed consumer smoke
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Installs locally packed tarballs in a scratch dir and imports every
      # export, so a dangling export or a missing runtime dependency fails the
      # PR instead of surfacing after publish. Boot checks are skipped (the
      # docker job below covers the image boot).
      - name: Packed consumer smoke
        run: bun scripts/consumer-smoke.ts --version 0.0.0-ci --pack

  admin-docker-build:
    name: admin docker build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build admin Docker image
        run: docker build -f admin/Dockerfile -t agent-admin:ci .

  chat-docker-build:
    name: chat docker build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile's module-resolution guard (bun build over every chat
      # source file) runs inside this build.
      - name: Build chat Docker image
        run: docker build -f chat/Dockerfile -t agent-chat:ci .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      # Boots the CI-built chat image against a throwaway Postgres: it must
      # apply its migrations and answer GET /health, in this PR rather than
      # only post-release.
      - name: Consumer smoke chat image boot
        run: bun scripts/consumer-smoke.ts --version 0.0.0-ci --pack --boot --no-agent-boot --no-admin-boot --no-import-probe --chat-image agent-chat:ci

  runtime-docker-build:
    name: runtime docker build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile's module-resolution guard (bun build over every runtime
      # source file) runs inside this build.
      - name: Build runtime Docker image
        run: docker build -f runtime/Dockerfile -t agent:ci .

      # Load-bearing: a green `bun test` in CI's unrestricted process does not
      # prove Chromium launches under a restricted securityContext (non-root,
      # no privilege escalation). The image's ENTRYPOINT is exec-form, so
      # --entrypoint overrides it to run the verify script.
      - name: Verify browser launch under sandbox restrictions
        run: |
          docker run --rm --user 1000 --security-opt=no-new-privileges \
            --entrypoint bun agent:ci \
            run scripts/verify-browser-launch.ts

      # Base-image contract smoke: builds a derived image FROM the image above
      # the way downstream repos do and asserts that a marketplace COPYed to
      # /opt/shipwright/marketplaces/ registers via installPlugins() and that
      # the entrypoint path runs under `bun run`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Base-image contract smoke test
        run: SHIPWRIGHT_CONTRACT_BASE_IMAGE=agent:ci bun test --config=bunfig.smoke.toml runtime/base-image-contract.smoke.test.ts

      # Boots the CI-built agent image through the consumer smoke's boot check
      # (packed tarballs, no release needed). Proves the image reaches
      # `[agent] agent home initialized` in this PR rather than only post-release.
      - name: Consumer smoke agent image boot
        run: bun scripts/consumer-smoke.ts --version 0.0.0-ci --pack --boot --no-admin-boot --no-chat-boot --no-import-probe --agent-image agent:ci

      # Load-bearing: a green `bun test` in CI's unrestricted process does not
      # prove whether /sys/fs/cgroup is delegated under a restricted securityContext.
      # The built image may fall back to procfs descendant walk (a fully-handled
      # fallback), so this is NOT a gate — just a durable log line showing which
      # mode the built image actually uses.
      - name: Report cgroup delegation mode under sandbox restrictions
        run: |
          docker run --rm --user 1000 --security-opt=no-new-privileges \
            --entrypoint bun agent:ci \
            run scripts/verify-cgroup-delegation.ts
