name: Chart Release

# Publishes the library chart at charts/agent-platform to a GitHub Pages Helm
# repository (the `gh-pages` branch), consumable via `helm repo add`.
#
#   publish (push to main) — packages the chart, merges it into the existing
#     gh-pages `index.yaml` (with the public Pages `--url`), and commits the
#     `.tgz` and `index.yaml` to gh-pages. Keyed off Chart.yaml's `version`: an
#     unchanged version repackages to no committable diff, so the effective
#     trigger is a version bump landing on main.
#
#   dry-run (pull_request) — validates the chart lints and packages and that the
#     index merges, without publishing anything.
on:
  push:
    branches: [main]
    paths:
      - "charts/agent-platform/**"
      - ".github/workflows/chart-release.yml"
  pull_request:
    paths:
      - "charts/agent-platform/**"
      - ".github/workflows/chart-release.yml"

# Least privilege at the workflow level; the publish job widens to contents:write.
permissions:
  contents: read

env:
  PAGES_URL: https://app-vitals.github.io/agent

jobs:
  publish:
    name: package + publish (gh-pages)
    if: github.event_name == 'push'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Serialized so concurrent `--merge` + push can't corrupt gh-pages index.yaml.
    concurrency:
      group: chart-release
      cancel-in-progress: false
    permissions:
      contents: write # push the .tgz + index.yaml to gh-pages
    outputs:
      published: ${{ steps.push.outputs.published }}
      version: ${{ steps.chart-version.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare gh-pages
        # actions/checkout fails on a missing ref, so fetch gh-pages by hand and
        # fall back to an empty orphan branch on the first publish. The branch is
        # created by the push in the final step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=gh-pages gh-pages
          cd gh-pages
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --quiet --depth=1 "$REMOTE" gh-pages; then
            git checkout --quiet -B gh-pages FETCH_HEAD
          else
            echo "No gh-pages branch yet; starting an empty orphan branch."
          fi

      - name: Configure Git identity
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Lint chart
        run: helm lint charts/agent-platform

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false

      - name: Unit-test shared helpers
        run: |
          helm dependency build charts/agent-platform/tests/fixtures/consumer
          helm unittest charts/agent-platform/tests/fixtures/consumer

      - name: Package chart into gh-pages
        run: helm package charts/agent-platform -d gh-pages/

      - name: Merge repo index
        # --merge fails if index.yaml doesn't exist yet (first publish on an
        # empty gh-pages), so the args are only passed when the file is present.
        run: |
          MERGE_ARGS=()
          [ -f gh-pages/index.yaml ] && MERGE_ARGS=(--merge gh-pages/index.yaml)
          helm repo index gh-pages/ "${MERGE_ARGS[@]}" --url "$PAGES_URL"

      - name: Parse chart version
        id: chart-version
        run: |
          CHART_VERSION=$(grep '^version:' charts/agent-platform/Chart.yaml | sed 's/^version: //')
          [ -z "$CHART_VERSION" ] && echo "Error: could not parse chart version from Chart.yaml" && exit 1
          echo "version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and push to gh-pages
        id: push
        working-directory: gh-pages
        env:
          CHART_VERSION: ${{ steps.chart-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- '*.tgz' index.yaml
          if git diff --cached --quiet; then
            echo "No chart changes to publish (version ${CHART_VERSION} already on gh-pages)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chart: publish agent-platform ${CHART_VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Tell Shipwright a new library chart version exists so it can bump its
  # dependency. Same mechanism and DISPATCH_TOKEN as release.yml's
  # notify-shipwright. No `!cancelled()`: a failed publish dispatches nothing,
  # and an unchanged version (nothing pushed) is not a release. A failed
  # dispatch fails this job and opens an issue.
  notify-shipwright:
    name: Notify Shipwright
    needs: [publish]
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.published == 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Dispatch chart-release to app-vitals/shipwright
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/app-vitals/shipwright/dispatches \
            -f event_type=chart-release \
            -f "client_payload[version]=$VERSION"

      - name: Open an issue when the dispatch failed
        if: ${{ failure() && steps.dispatch.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Shipwright dispatch failed for chart release $VERSION" \
            --body "The \`chart-release\` repository_dispatch to app-vitals/shipwright failed for agent-platform chart version $VERSION, so Shipwright was not told to bump its library dependency. Check that the \`DISPATCH_TOKEN\` secret is valid, then re-run the failed job: $RUN_URL"

  dry-run:
    name: package + index (dry run)
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Lint chart
        run: helm lint charts/agent-platform

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false

      - name: Unit-test shared helpers
        run: |
          helm dependency build charts/agent-platform/tests/fixtures/consumer
          helm unittest charts/agent-platform/tests/fixtures/consumer

      - name: Package chart (no publish)
        run: helm package charts/agent-platform -d .cr-release-packages

      - name: Generate repo index (no publish)
        # Same --url as publish, so the dry run exercises the real index entries.
        run: helm repo index .cr-release-packages --url "$PAGES_URL"

      - name: Merge into live index (no publish)
        # Proves the --merge path against the published index when it exists.
        run: |
          if curl -fsSL "$PAGES_URL/index.yaml" -o live-index.yaml; then
            helm repo index .cr-release-packages --merge live-index.yaml --url "$PAGES_URL"
          else
            echo "No published index yet; merge path skipped."
          fi

      - name: Show packaged artifacts
        run: ls -la .cr-release-packages && cat .cr-release-packages/index.yaml
