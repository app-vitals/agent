name: Release

# Two entry points, one workflow file (npm Trusted Publishing is bound to the
# workflow filename `release.yml`, so every publish step must live here):
#   1. workflow_dispatch without `tag`: semantic-release cuts the next version,
#      creating the vX.Y.Z tag and GitHub release as the RELEASE_PAT identity.
#   2. push of a vX.Y.Z tag (made by step 1, whose PAT push triggers workflows),
#      or workflow_dispatch with `tag`: publish the three npm packages and the
#      three container images (agent, agent-admin, agent-chat) for that tag. Re-running is idempotent: versions and
#      image tags that already exist are skipped.
#   3. workflow_dispatch with `version` and dry_run=true, no tag: rehearse the
#      publish at the dispatched commit (github.sha) before any tag exists.
#      Nothing is pushed; without dry_run this fails fast.
#   4. push to main, only when the repo variable AUTO_RELEASE is 'true' (unset
#      means off, and clearing it is the kill switch): wait for the commit's CI
#      to go green, then run step 1. A commit with no feat/fix/perf produces no
#      release and the run stays green. Every failure path fails the run; a red
#      build is the alert.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: semantic-release --dry-run, or npm publish --dry-run and unpushed image builds when `tag` or `version` is set"
        type: boolean
        required: false
        default: false
      tag:
        description: "Publish this existing vX.Y.Z tag instead of cutting a release (re-run or dry-run a publish)"
        type: string
        required: false
        default: ""
      version:
        description: "Rehearse the publish at the dispatched commit as X.Y.Z with no tag (requires dry_run=true)"
        type: string
        required: false
        default: ""
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Reserved baseline tag for semantic-release; never publishes.
      - "!v0.0.0"

# Least privilege at the workflow level; each job asks for what it needs.
permissions:
  contents: read

jobs:
  guard:
    name: Admin check
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Assert actor is admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission')
          if [ "$PERMISSION" != "admin" ]; then
            echo "Error: $ACTOR is not a repo admin (got: $PERMISSION)" >&2
            exit 1
          fi

  # Push-to-main path only: hold the release until the commit's CI is green.
  wait:
    name: Wait for CI
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && vars.AUTO_RELEASE == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for the CI check-runs on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          REQUIRED=("lint / typecheck / boundary / test" "runtime docker build" "admin docker build" "chat docker build")
          DEADLINE=$((SECONDS + 25 * 60))
          while true; do
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --paginate --jq '.check_runs[] | {name, status, conclusion}' | jq -s '.')
            PENDING=0
            for NAME in "${REQUIRED[@]}"; do
              # Latest run wins when a check was re-run.
              STATE=$(jq -r --arg n "$NAME" '[.[] | select(.name == $n)] | if length == 0 then "missing" elif .[-1].status != "completed" then "pending" else .[-1].conclusion end' <<<"$RUNS")
              case "$STATE" in
                success) ;;
                missing | pending) PENDING=1 ;;
                *)
                  echo "Error: check '$NAME' finished '$STATE'; not releasing $SHA" >&2
                  exit 1
                  ;;
              esac
            done
            if [ "$PENDING" -eq 0 ]; then
              echo "All required checks are green on $SHA"
              exit 0
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "Error: required checks missing or still running after 25 minutes; not releasing $SHA" >&2
              exit 1
            fi
            sleep 30
          done

  release:
    name: semantic-release
    # `guard` is skipped on a push to main and `wait` on a dispatch, so
    # `!cancelled()` replaces the implicit `success()`; a failed guard or wait
    # still blocks the release.
    if: ${{ !cancelled() && needs.guard.result != 'failure' && needs.wait.result != 'failure' && ((github.event_name == 'workflow_dispatch' && inputs.tag == '' && inputs.version == '') || (github.event_name == 'push' && github.ref_type == 'branch' && vars.AUTO_RELEASE == 'true')) }}
    # One version cut at a time, queued rather than cancelled. Scoped to this job
    # (not the workflow) so the 25-minute `wait` and the tag-publish jobs never
    # hold or replace a pending slot: GitHub keeps one pending run per group, so a
    # workflow-wide group let a later main push cancel a queued tag publish.
    concurrency:
      group: release
      cancel-in-progress: false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [guard, wait]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_PAT (not GITHUB_TOKEN) so the tag it pushes triggers the
          # publish jobs below; GITHUB_TOKEN pushes never trigger workflows.
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
          # Release jobs publish artifacts: never restore a shared cache into them.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release (dry run)
        if: ${{ inputs.dry_run }}
        run: bunx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Release
        if: ${{ !inputs.dry_run }}
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  resolve:
    name: Resolve release tag
    # `guard` is skipped on tag pushes, so `!cancelled()` replaces the implicit
    # `success()`; a failed guard (non-admin dispatch) still blocks publishing.
    if: ${{ !cancelled() && needs.guard.result != 'failure' && ((github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (inputs.tag != '' || inputs.version != ''))) }}
    needs: guard
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Validate tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then TAG="$PUSHED_TAG"; else TAG="$INPUT_TAG"; fi
          DRY_RUN=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN=true; fi
          if [ -z "$TAG" ]; then
            # Tagless rehearsal: only a dry run, at the dispatched commit.
            if [ "$DRY_RUN" != "true" ]; then
              echo "Error: dispatching with version and no tag requires dry_run=true; a real publish needs an existing vX.Y.Z tag" >&2
              exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: '$INPUT_VERSION' is not an X.Y.Z version" >&2
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            REF="$SHA"
          else
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: '$TAG' is not a vX.Y.Z release tag" >&2
              exit 1
            fi
            VERSION="${TAG#v}"
            REF="refs/tags/$TAG"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "ref=$REF"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Anyone with write access can push a tag at any commit; only publish
      # commits that landed on main through the normal review path.
      - name: Verify tag commit is on main
        # A tagless dry-run rehearsal has no tag to verify and publishes nothing.
        if: ${{ steps.resolve.outputs.tag != '' }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main; then
            echo "Error: $TAG does not point at a commit reachable from main" >&2
            exit 1
          fi

  publish-npm:
    name: Publish ${{ matrix.package }}
    needs: resolve
    # `guard` is skipped on tag pushes, which would fail the implicit
    # `success()`; `!cancelled()` replaces it. A failed guard still blocks
    # publishing because `resolve` is then skipped, not successful.
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Publish in dependency order: agent-admin depends on agent-lib.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        package: [lib, runtime, admin]
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC): no registry token is used anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
          # Release jobs publish artifacts: never restore a shared cache into them.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: sudo npm install --global npm@^11.5.1 && npm --version

      - name: Stamp the release version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # Version fields in the repo are placeholders; the tag is the source
          # of truth. Stamp all three so workspace:* ranges pack as VERSION.
          for dir in lib runtime admin; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      - name: Pack
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # bun pm pack does not use the stamped version when it rewrites
          # workspace:* ranges (it packed agent-lib 0.1.0 into 0.1.1), so pin
          # every @app-vitals/* range to VERSION explicitly before packing.
          bun scripts/pack-ranges.ts rewrite --version "$VERSION" "$PACKAGE"
          mkdir -p "$RUNNER_TEMP/pack"
          (cd "$PACKAGE" && bun pm pack --destination "$RUNNER_TEMP/pack")

      - name: Assert packed dependency ranges
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bun scripts/pack-ranges.ts assert --version "$VERSION" "$RUNNER_TEMP"/pack/*.tgz

      - name: Publish
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
        run: |
          NAME=$(jq -r .name "$PACKAGE/package.json")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; skipping"
            exit 0
          fi
          FLAGS=(--provenance --access public)
          if [ "$DRY_RUN" = "true" ]; then FLAGS+=(--dry-run); fi
          npm publish "$RUNNER_TEMP"/pack/*.tgz "${FLAGS[@]}"

  publish-image:
    name: Image ghcr.io/app-vitals/${{ matrix.image }}
    needs: resolve
    # `guard` is skipped on tag pushes, which would fail the implicit
    # `success()`; `!cancelled()` replaces it. A failed guard still blocks
    # publishing because `resolve` is then skipped, not successful.
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent
            dockerfile: runtime/Dockerfile
          - image: agent-admin
            dockerfile: admin/Dockerfile
          - image: agent-chat
            dockerfile: chat/Dockerfile
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/app-vitals/${{ matrix.image }}
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Log in to ghcr.io
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Check whether the image tag already exists
        id: exists
        run: |
          if [ "$DRY_RUN" != "true" ] && docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists; skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The Dockerfiles' module-resolution guards (bun build over every runtime /
      # chat source file) run inside this build.
      - name: Build image
        if: ${{ steps.exists.outputs.exists != 'true' }}
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -f "$DOCKERFILE" -t "$IMAGE:$VERSION" .

      - name: Verify browser launch under sandbox restrictions
        if: ${{ matrix.image == 'agent' && steps.exists.outputs.exists != 'true' }}
        run: |
          docker run --rm --user 1000 --security-opt=no-new-privileges \
            --entrypoint bun "$IMAGE:$VERSION" \
            run scripts/verify-browser-launch.ts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ matrix.image == 'agent' && steps.exists.outputs.exists != 'true' }}
        with:
          bun-version: "1.4.3"
          # Release jobs publish artifacts: never restore a shared cache into them.
          no-cache: true

      - name: Base-image contract smoke test
        if: ${{ matrix.image == 'agent' && steps.exists.outputs.exists != 'true' }}
        run: SHIPWRIGHT_CONTRACT_BASE_IMAGE="$IMAGE:$VERSION" bun test runtime/base-image-contract.smoke.test.ts

      - name: Push image
        if: ${{ needs.resolve.outputs.dry_run != 'true' && steps.exists.outputs.exists != 'true' }}
        run: docker push "$IMAGE:$VERSION"

  # Tell Shipwright a new platform version exists so it can bump and rebuild
  # without waiting for Renovate. Failures must be loud: the 2026-10-02..10-09
  # poller stall went unnoticed for a week because it failed silently. A failed
  # dispatch fails this job (and so the workflow) and opens an issue.
  notify-shipwright:
    name: Notify Shipwright
    needs: [resolve, publish-npm, publish-image]
    # `!cancelled()` replaces the implicit `success()`, which fails when `guard`
    # was skipped (tag push); each publish job must still have succeeded.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.publish-npm.result == 'success' && needs.publish-image.result == 'success' && needs.resolve.outputs.dry_run != 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Dispatch platform-release to app-vitals/shipwright
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/app-vitals/shipwright/dispatches \
            -f event_type=platform-release \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[chat_image]=ghcr.io/app-vitals/agent-chat:$VERSION"

      - name: Open an issue when the dispatch failed
        if: ${{ failure() && steps.dispatch.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Shipwright dispatch failed for platform release $VERSION" \
            --body "The \`platform-release\` repository_dispatch to app-vitals/shipwright failed for version $VERSION, so Shipwright was not told to bump and rebuild. Check that the \`DISPATCH_TOKEN\` secret is valid, then re-run the failed job: $RUN_URL"

  # Post-publish smoke of the released artifacts. Never on dry runs (nothing
  # was pushed). Publish steps stay in this file for npm Trusted Publishing.
  consumer-smoke:
    name: Consumer smoke
    # `!cancelled()` replaces the implicit `success()`, which fails when `guard`
    # was skipped (tag push); each publish job must still have succeeded.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.publish-npm.result == 'success' && needs.publish-image.result == 'success' && needs.resolve.outputs.dry_run != 'true' }}
    needs: [resolve, publish-npm, publish-image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/consumer-smoke.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
